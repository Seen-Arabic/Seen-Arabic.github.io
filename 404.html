<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,follow" />
    <meta name="theme-color" content="#33485d" />
    <title>الصفحة غير موجودة - س - Seen</title>
    <style>
      @font-face {
        font-family: 'IBM Plex Sans Arabic';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/assets/fonts/ibm-plex/arabic/IBMPlexSansArabic-Regular.woff2') format('woff2');
        unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB50-FDFF, U+FE70-FEFF;
      }
      @font-face {
        font-family: 'IBM Plex Sans Arabic';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('/assets/fonts/ibm-plex/arabic/IBMPlexSansArabic-Bold.woff2') format('woff2');
        unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB50-FDFF, U+FE70-FEFF;
      }
      @font-face {
        font-family: 'IBM Plex Sans';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/assets/fonts/ibm-plex/latin/IBMPlexSans-Regular.woff2') format('woff2');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
          U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'IBM Plex Sans';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('/assets/fonts/ibm-plex/latin/IBMPlexSans-Bold.woff2') format('woff2');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
          U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      :root {
        color-scheme: light;
        font-family: 'IBM Plex Sans Arabic', 'IBM Plex Sans', sans-serif;
        color: #1e2b3c;
        background: #f5f7fe;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        grid-template-rows: auto 1fr auto;
      }
      header,
      footer {
        background: #33485d;
        border-color: #dce4ed;
        border-style: solid;
        color: #fff;
        padding: 1rem max(1rem, calc((100% - 72rem) / 2));
      }
      header {
        border-width: 0 0 1px;
      }
      footer {
        border-width: 1px 0 0;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem 1.25rem;
      }
      nav a {
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        margin-inline-end: auto;
      }
      .brand img {
        width: 2.75rem;
        height: 2.75rem;
        object-fit: contain;
      }
      main {
        width: min(100% - 2rem, 48rem);
        margin: auto;
        padding-block: 4rem;
        text-align: center;
      }
      .code {
        margin: 0;
        color: #5296cf;
        font-weight: 800;
      }
      h1 {
        margin: 0.25rem 0 1rem;
        font-size: clamp(2rem, 5vw, 3rem);
      }
      main p:not(.code) {
        color: #536274;
        line-height: 1.8;
      }
      .home {
        display: inline-block;
        margin-block-start: 1rem;
        border-radius: 0.75rem;
        background: #1e2b3c;
        color: white;
        padding: 0.8rem 1.1rem;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #e7a93e;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <header>
      <nav aria-label="التنقل الرئيسي">
        <a class="brand" href="/">
          <img src="/assets/brand/seen-logo.svg" alt="" width="48" height="48" />
          <span>س - Seen</span>
        </a>
        <a href="/">الرئيسية</a>
        <a href="/blog/">المدونة</a>
        <a href="/Arabic-Services/">خدمات اللغة العربية</a>
        <a href="/about/">من نحن</a>
      </nav>
    </header>
    <main>
      <p class="code">404</p>
      <h1>الصفحة غير موجودة</h1>
      <p>ربما نُقلت الصفحة أو أن الرابط غير صحيح.</p>
      <a class="home" href="/">العودة إلى الصفحة الرئيسية</a>
    </main>
    <footer>هدفنا نشر العلم والمعرفة بين مجتمعاتنا العربية.</footer>

</html>
